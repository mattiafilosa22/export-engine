name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Start MySQL 8 (native_password for PHP 7.3)
        run: |
          docker run -d --name mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=gamindo_test \
            -p 3306:3306 \
            mysql:8.0 --default-authentication-plugin=mysql_native_password
          echo "Waiting for MySQL to be ready..."
          for i in $(seq 1 30); do
            if docker exec mysql mysqladmin ping -h localhost -uroot -proot --silent; then
              echo "MySQL ready."; break
            fi
            sleep 2
          done

      - name: Setup PHP 7.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.3"
          extensions: mbstring, pdo_mysql, pdo_sqlite, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (PSR-12)
        run: composer lint

      - name: Static analysis (PHPStan)
        run: composer analyse

      - name: Tests (PHPUnit)
        run: composer test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root
