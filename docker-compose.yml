services:
  # HTTP: php artisan serve (dev). Nelle slice successive si potra' passare a nginx+fpm.
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      # Porta host override-abile (default 8080; 8000 spesso occupata da OrbStack).
      - "${APP_PORT:-8080}:8000"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      # Attende il completamento delle migrazioni: niente race con la tabella jobs.
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # Worker di coda separato (backend database).
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php artisan queue:work --tries=3 --sleep=1 --timeout=90
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      # Parte solo dopo le migrazioni: la tabella jobs esiste gia'.
      migrate:
        condition: service_completed_successfully

  # Migrazioni one-shot: gira, applica le migration e termina (exit 0).
  # app e worker dipendono dal suo completamento -> nessun crash al primo boot.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php artisan migrate --force
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    # native_password evita la frizione di caching_sha2 con mysqlnd di PHP 7.3
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: gamindo
      MYSQL_USER: gamindo
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stato volatile (progress/lock/cancellazione) delle slice successive.
  redis:
    image: redis:6-alpine
    ports:
      # Porta host override-abile (default 6380; 6379 spesso occupata da OrbStack).
      - "${REDIS_PORT_HOST:-6380}:6379"
    volumes:
      - redisdata:/data

volumes:
  dbdata:
  redisdata:
