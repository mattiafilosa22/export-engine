services:
  # HTTP: php artisan serve (dev). Later slices may switch to nginx+fpm.
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      # Overridable host port (default 8080; 8000 often taken by OrbStack).
      - "${APP_PORT:-8080}:8000"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      # Waits for migrations to finish: no race with the jobs table.
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # Separate queue worker (database backend).
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php artisan queue:work --tries=3 --sleep=1 --timeout=90
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      # Starts only after migrations: the jobs table already exists.
      migrate:
        condition: service_completed_successfully

  # One-shot migrations: runs, applies the migrations and exits (exit 0).
  # app and worker depend on its completion -> no crash on first boot.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php artisan migrate --force
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    # native_password avoids the caching_sha2 friction with PHP 7.3 mysqlnd
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: gamindo
      MYSQL_USER: gamindo
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Volatile state (progress/lock/cancellation) for later slices.
  redis:
    image: redis:6-alpine
    ports:
      # Overridable host port (default 6380; 6379 often taken by OrbStack).
      - "${REDIS_PORT_HOST:-6380}:6379"
    volumes:
      - redisdata:/data

volumes:
  dbdata:
  redisdata:
